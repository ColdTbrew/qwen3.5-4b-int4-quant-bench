# Identical evaluation settings for every checkpoint.
vllm:
  gpu_memory_utilization: 0.16   # reduced: Spark memory is shared with other tenants (see README)
  max_model_len: 4096
  max_num_seqs: 32
  language_model_only: true       # text-only; vision tower not profiled
  seed: 0

ppl:
  dataset: Salesforce/wikitext
  config: wikitext-2-raw-v1
  split: test
  join: "\n\n"
  context_length: 2048
  stride: 2048                   # non-overlapping windows; first token of each window unscored

lm_eval:
  # Plain few-shot prompting (no chat template, no thinking) for all models.
  # Consistent subsampling for ALL models (lm-eval takes the first N docs, so every
  # model sees identical items). Full sets were ~4-6 h/model on the shared GB10
  # (MMLU alone = 56k loglikelihood requests); see README "Limits".
  # NOTE: for the mmlu group, limit applies per subject (57 subjects x 30 = 1,710 questions).
  tasks:
    mmlu:          {num_fewshot: 0, limit: 30}     # 0-shot: 5-shot prompt-logprob scoring over the 248k vocab was ~5 h/model on GB10
    gsm8k:         {num_fewshot: 5, limit: 250}
    arc_challenge: {num_fewshot: 0, limit: null}   # full 1,172
    hellaswag:     {num_fewshot: 0, limit: 1000}
  batch_size: auto
  seed: 1234

bench:
  port: 8100
  input_len: 1024
  output_len: 256
  concurrency: [1, 8, 32]
  num_prompts: {1: 16, 8: 64, 32: 128}
  warmup_prompts: 8
